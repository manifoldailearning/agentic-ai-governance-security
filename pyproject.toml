[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-governance-security"
version = "1.0.0"
description = "Securing and governing AI agents: threat modeling, access control, injection defense, DLP, oversight, audit and compliance"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nachiketh Murthy" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
ags = "ags.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]

[tool.ruff]
line-length = 66
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
